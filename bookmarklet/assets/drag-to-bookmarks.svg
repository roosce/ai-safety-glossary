<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img"
     aria-label="Animation: dragging the AI Safety Glossary button up onto the browser's bookmarks bar.">
  <style>
    .win    { fill: #fff; stroke: #e4e6ea; stroke-width: 1; }
    .bar    { fill: #f5f6f8; }
    .bm     { font: 600 11px system-ui, -apple-system, sans-serif; fill: #667788; }
    .hint   { font: 13px system-ui, -apple-system, sans-serif; fill: #99a; }
    .pill   { fill: #1f2430; }
    .plabel { font: 600 11px system-ui, -apple-system, sans-serif; fill: #fff; }
    .slot   { fill: none; stroke: #2f9e8f; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .cursor { fill: #1f2430; stroke: #fff; stroke-width: 1.5; }

    /* Button (with its cursor) travels from the page up onto the bookmarks bar. */
    @keyframes drag {
      0%, 8%   { transform: translate(150px, 120px); }
      22%      { transform: translate(146px, 116px) scale(.97); } /* grab */
      62%      { transform: translate(22px, 5px) scale(.97); }    /* drag up */
      72%, 88% { transform: translate(20px, 4px) scale(1); }      /* drop on bar */
      100%     { transform: translate(150px, 120px); }
    }
    @keyframes fade {
      0%, 4% { opacity: 0; } 8%, 90% { opacity: 1; } 97%, 100% { opacity: 0; }
    }
    @keyframes slotPulse {
      0%, 24% { opacity: 0; } 34%, 66% { opacity: 1; } 80%, 100% { opacity: 0; }
    }
    .drag { animation: drag 6s ease-in-out infinite, fade 6s linear infinite; }
    .slot { animation: slotPulse 6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .drag { animation: none; transform: translate(20px, 4px); opacity: 1; }
      .slot { animation: none; opacity: 0; }
    }
  </style>

  <!-- Browser window + bookmarks bar -->
  <rect class="win" x="1" y="1" width="318" height="188" rx="8"/>
  <rect class="bar" x="2" y="2" width="316" height="26"/>
  <text class="bm" x="16" y="19">★ Docs</text>
  <text class="bm" x="74" y="19">★ Mail</text>

  <!-- Drop target on the bar -->
  <rect class="slot" x="118" y="5" width="120" height="20" rx="6"/>

  <!-- Page hint -->
  <text class="hint" x="20" y="165">Drag it up to your bookmarks bar — once.</text>

  <!-- Dragged button with pointer -->
  <g class="drag">
    <rect class="pill" x="0" y="0" width="116" height="22" rx="6"/>
    <text class="plabel" x="10" y="15">📘 AI Safety Glossary</text>
    <path class="cursor" transform="translate(104 15)"
          d="M0 0 L0 17 L4.5 12.5 L7.5 18.5 L9.7 17.5 L6.6 11.6 L12 11.6 Z"/>
  </g>
</svg>
